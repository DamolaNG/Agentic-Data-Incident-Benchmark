version: 2

models:
  - name: stg_orders
    description: Cleaned staging model for synthetic orders.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: order_timestamp
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
      - name: order_total
        tests:
          - not_null

