version: 2

models:
  - name: mart_daily_funnel
    description: Daily product funnel metrics by session date.
    config:
      tags: ["mart", "funnel", "daily"]
      meta:
        owner: product_analytics
        grain: one row per session date
    columns:
      - name: session_date
        description: Date when sessions started.
        tests: [not_null, unique]
      - name: sessions
        description: Total sessions that started on the date.
        tests: [not_null]
      - name: product_view_sessions
        description: Sessions that reached product view.
        tests: [not_null]
      - name: add_to_cart_sessions
        description: Sessions that reached add to cart.
        tests: [not_null]
      - name: checkout_started_sessions
        description: Sessions that reached checkout.
        tests: [not_null]
      - name: purchase_sessions
        description: Sessions that reached purchase.
        tests: [not_null]
      - name: session_conversion_rate
        description: Purchase sessions divided by total sessions.

  - name: mart_revenue_daily
    description: Daily revenue metrics by transaction date.
    config:
      tags: ["mart", "revenue", "daily"]
      meta:
        owner: finance_analytics
        grain: one row per transaction date
    columns:
      - name: revenue_date
        description: Date when transactions occurred.
        tests: [not_null, unique]
      - name: transaction_count
        description: Total transaction attempts on the date.
        tests: [not_null]
      - name: succeeded_transactions
        description: Successful transactions on the date.
        tests: [not_null]
      - name: gross_revenue
        description: Revenue from successful transactions.
        tests: [not_null]
      - name: average_order_value
        description: Average successful transaction amount.

